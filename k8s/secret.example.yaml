# Copy to secret.yaml and fill in (DO NOT COMMIT secret.yaml).
#   kubectl create secret generic network-incident-secrets \
#     --from-literal=TIDB_HOST=... --from-literal=TIDB_USER=... \
#     --from-literal=TIDB_PASSWORD=... --from-literal=GOOGLE_CLOUD_PROJECT=...
# For Vertex auth, mount a service-account key or use Workload Identity instead.
apiVersion: v1
kind: Secret
metadata:
  name: network-incident-secrets
type: Opaque
stringData:
  TIDB_HOST: "gateway01.<region>.prod.aws.tidbcloud.com"
  TIDB_USER: "<user>.root"
  TIDB_PASSWORD: "<password>"
  GOOGLE_CLOUD_PROJECT: "<project-id>"
